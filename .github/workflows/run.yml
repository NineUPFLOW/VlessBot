name: VLESS Bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vless-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          python - <<'PY'
          import os, sys
          required = ["BOT_TOKEN", "CHAT_ID", "API_ID", "API_HASH", "TG_SESSION"]
          missing = [k for k in required if not os.environ.get(k, "").strip()]
          if missing:
              print("Missing secrets:", ", ".join(missing))
              sys.exit(1)
          print("All required secrets present.")
          PY

      - name: Restore state from cache
        uses: actions/cache/restore@v4
        with:
          key: vless-state-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            vless-state-${{ github.ref_name }}-
            vless-state-
          path: |
            vless_state.db
            vless_state.db-wal
            vless_state.db-shm

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOPIC_ID: ${{ secrets.TOPIC_ID }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python -u bot.py

      - name: Show state stats
        if: always()
        run: |
          python - <<'PY'
          import os, sqlite3
          if not os.path.exists("vless_state.db"):
              print("No state DB")
              raise SystemExit(0)
          conn = sqlite3.connect("vless_state.db")
          for table in ("seen_proxies", "published_proxies"):
              try:
                  n = conn.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
                  print(f"{table}: {n}")
              except Exception as e:
                  print(f"{table}: error {e}")
          PY

      - name: Save state to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          key: vless-state-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            vless_state.db
            vless_state.db-wal
            vless_state.db-shm
